plugins:
  - rubocop-capybara
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "Guardfile"
    - config/environments/*.rb
    - config/initializers/simple_form.rb
    - config/routes.rb

Layout/LineLength:
  Max: 120

Rails/StrongParametersExpect:
  AutoCorrect: disabled

RSpec/InstanceVariable:
  Exclude:
    - "spec/views/**/*"

RSpec/ImplicitSubject:
  EnforcedStyle: require_implicit

Naming/PredicateMethod:
  AllowedMethods:
    - call
    - method_missing

# Browser system specs walk one whole user flow per example: the browser boots
# once, and splitting a flow into one-expectation examples would repeat that
# cost and break the flow. Only these two cops are relaxed, only for this directory.
RSpec/ExampleLength:
  Exclude:
    - "spec/system/**/*"

RSpec/MultipleExpectations:
  Exclude:
    - "spec/system/**/*"
