default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: 127.0.0.1
  username: postgres
  password: postgres

development:
  <<: *default
  database: lease_manager_development

test:
  <<: *default
  database: lease_manager_test

production:
  <<: *default
  database: lease_manager_production
  username: lease_manager
  password: <%= ENV["LEASE_MANAGER_DATABASE_PASSWORD"] %>
