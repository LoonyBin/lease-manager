name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [ main ]
    types: [ completed ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Add Dokku host to known_hosts
        run: ssh-keyscan -H 91.98.73.173 >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        run: git push dokku@91.98.73.173:lease-manager HEAD:refs/heads/main --force

      - name: Smoke test
        run: curl --fail --silent --show-error --max-time 30 https://lease-manager.loonyb.in/up
