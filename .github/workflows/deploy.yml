name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9"

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/lease-manager-images/lease-manager:${{ github.sha }}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Tofu init
        working-directory: infra
        run: tofu init

      - name: Tofu apply
        working-directory: infra
        run: |
          tofu apply \
            -auto-approve \
            -var "project_id=${{ env.GCP_PROJECT_ID }}" \
            -var "region=${{ env.GCP_REGION }}" \
            -var "image_tag=${{ github.sha }}" \
            -var "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -var "cloudflare_account_id=${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            -var "cloudflare_zone_id=${{ vars.CLOUDFLARE_ZONE_ID }}"

      - name: Run database migrations
        run: |
          gcloud run jobs execute lease-manager-migrate \
            --region="${{ env.GCP_REGION }}" \
            --wait

      - name: Smoke test
        run: |
          URL=$(cd infra && tofu output -raw cloud_run_url)
          curl --fail --silent --show-error "${URL}/up"
